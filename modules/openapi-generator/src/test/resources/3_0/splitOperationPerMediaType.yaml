components:
  schemas:

    Person:
      description: person
      type: object
      properties:
        lastName:
          type: string
        firstName:
          type: string
    FileMetadata:
      type: object
      properties:
        filename:
          type: string
  requestBodies:
    File:
      description: person
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              filename:
                type: string
              file:
                type: string
                format: binary
        application/json:
          schema:
            $ref: "#/components/schemas/FileMetadata"
