openapi: 3.0.1
info:
  version: 1.0.0
  title: Example
  license:
    name: MIT
servers:
  - url: http://api.example.xyz/v1
paths:
  /file/{id}:
    parameters:
      - name: id
        schema:
          type: string
        required: true
        in: path
    put:
      operationId: updateFileOrMetadata
      requestBody:
        x-operation-id: uploadFile
        $ref: "#/components/requestBodies/File"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMetadata"
            application/octet-stream:
              x-operation-id: uploadFile
              schema:
                type: string
                format: binary
